# Basic CSF visualization shared by the four cantilever models.
# Longitudinal stations and geometric dimensions are in mm.
CSF_ACTIONS:
  stations:
    section_stations: [0.0, 2500.0, 5000.0]
  actions:
    - plot_volume_3d:
        params:
          title: "CSF cantilever geometry"
          seed: w
    - plot_section_2d:
        stations:
          - section_stations
    - plot_weight:
        output:
          - stdout
        params:
          num_points: 100
    - section_selected_analysis:
        stations: section_stations
      - section_selected_analysis:
        properties: [A, Cx, Cy, Ix, Iy, Ixy, Ip, I1, I2, rx, ry, Wx, Wy,J_s_vroark, J_s_vroark_fidelity]
    - plot_properties:
        output:
          - stdout
        properties: [A, Ix, Iy]
        params:
          num_points: 100
