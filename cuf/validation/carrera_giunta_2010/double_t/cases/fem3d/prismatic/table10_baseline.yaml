case:
  name: fem3d_table10

model:
  csf_yaml: ../models/carrera_double_t_prismatic_csf.yaml

problem:
  type: torsion_line_pair_halfwave
  amplitude: 1.0

mesh:
  longitudinal_divisions: 100
  flange_overhang_divisions: 10
  web_width_divisions: 10
  flange_thickness_divisions: 5
  web_height_divisions: 40
  load_gauss_order: 6

# longitudinal_divisions: 80
# flange_overhang_divisions: 8
# web_width_divisions: 8
# flange_thickness_divisions: 4
# web_height_divisions: 32
# load_gauss_order: 6
  
analysis:
  system: SuperLU

outputs:
  maxima:
    - name: ux
      source_component: z
      sign: -1.0
      operation: max_abs
    - name: uy
      source_component: y
      sign: 1.0
      operation: max_abs
    - name: uz
      source_component: x
      sign: 1.0
      operation: max

report:
  type: carrera_table10_style
  sections_x_over_L:
    - 0.00
    - 0.25
    - 0.50
    - 0.75
    - 1.00
checks:
  equilibrium_tolerance: 1.0e-8

output:
  directory: ../output/fem3d_table10
