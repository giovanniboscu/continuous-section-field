case:
  name: fem3d_prismatic_bending

model:
  csf_yaml: ../models/carrera_double_t_prismatic_csf.yaml

problem:
  type: bending_bottom_surface_halfwave
  amplitude: 1.0

mesh:
  longitudinal_divisions: 80
  flange_overhang_divisions: 8
  web_width_divisions: 8
  flange_thickness_divisions: 4
  web_height_divisions: 32
  load_gauss_order: 6

analysis:
  system: SuperLU

outputs:
  maxima:
    - name: ux
      source_component: z
      sign: -1.0
      operation: max
    - name: uy
      source_component: y
      sign: 1.0
      operation: max_abs

    - name: uz
      source_component: x
      sign: 1.0
      operation: max

# Display only. Published Table-9 result values are not stored here.
report:
  type: carrera_table9_style
  sections_x_over_L:
    - 0.00
    - 0.25
    - 0.50
    - 0.75
    - 1.00

checks:
  equilibrium_tolerance: 1.0e-8

output:
  directory: ../output/fem3d_prismatic_bending
