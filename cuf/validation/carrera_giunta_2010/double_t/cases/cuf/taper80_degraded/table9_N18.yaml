case:
  name: cuf_taper80_deg_table9_N18

model:
  csf_yaml: ../models/carrera_double_t_taper80_csf_deg.yaml

problem:
  type: carrera_bending_bottom_surface_halfwave
  amplitude: 1.0

cuf:
  basis: scaled_maclaurin
  order: 18

longitudinal:
  method: finite_element
  elements: 1
  order: 6
  gauss_order: 9

section_integration:
  method: fixed_gauss_polygon
  gauss_order: 6

sampling:
  stations:
    - 0.00
    - 0.25
    - 0.50
    - 0.75
    - 1.00
  displacement_samples: 201
  stress_grid: 31

output:
  directory: ../output/cuf_taper80_deg_table9_N18