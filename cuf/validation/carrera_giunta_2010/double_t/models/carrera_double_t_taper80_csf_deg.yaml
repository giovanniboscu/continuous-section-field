# Variable-section test derived from the prismatic l/a=10 benchmark.
# S0 is unchanged.
# At S1 only:
#   clear web height = 20 mm  (-80% from 100 mm)
#   flange thickness = 25 mm  (unchanged)
#   total outer height = 70 mm
#
# Carrera & Giunta (2010), Section 6.2, I-shaped cross-section.
# CSF model: geometry and per-polygon material carriers.
#
# Paper ratios:
#   a/b  = 3/2
#   s1/a = 1/4
#   s2/a = 1/4
#   l/a  = 10
#
# Dimensional normalization:
#   a  = 100 mm       # clear web height
#   b  = 66.6666666666667 mm       # total flange width
#   s1 = 25 mm      # flange thickness
#   s2 = 25 mm      # web thickness
#   total outer height = 150 mm
#   l  = 1000 mm
#
# Transverse mapping:
#   YAML first coordinate  = paper y
#   YAML second coordinate = -paper x

CSF:
  sections:
    S0:
      z: 0.0
      polygons:
        - name: top_flange
          weight: 71700.0
          vertices:
            - [-33.3333333333333, 50]
            - [-12.5, 50]
            - [12.5, 50]
            - [33.3333333333333, 50]
            - [33.3333333333333, 75]
            - [-33.3333333333333, 75]
        - name: web
          weight: 71700.0
          vertices:
            - [-12.5, -50]
            - [12.5, -50]
            - [12.5, 50]
            - [-12.5, 50]
        - name: bottom_flange
          weight: 71700.0
          vertices:
            - [-33.3333333333333, -75]
            - [33.3333333333333, -75]
            - [33.3333333333333, -50]
            - [12.5, -50]
            - [-12.5, -50]
            - [-33.3333333333333, -50]

    S1:
      z: 1000
      polygons:
        - name: top_flange
          weight: 57360.0
          vertices:
            - [-33.3333333333333, 10]
            - [-12.5, 10]
            - [12.5, 10]
            - [33.3333333333333, 10]
            - [33.3333333333333, 35]
            - [-33.3333333333333, 35]
        - name: web
          weight: 57360.0
          vertices:
            - [-12.5, -10]
            - [12.5, -10]
            - [12.5, 10]
            - [-12.5, 10]
        - name: bottom_flange
          weight: 57360.0
          vertices:
            - [-33.3333333333333, -35]
            - [33.3333333333333, -35]
            - [33.3333333333333, -10]
            - [12.5, -10]
            - [-12.5, -10]
            - [-33.3333333333333, -10]

  shear_weight_laws:
    - 'iso(0.3)'
