# Paper section 4.1: one B2 element, quadratic L9 transverse expansion.
# MITC ON. Full longitudinal Gauss quadrature (15).
case:
  name: mitc_paper41_L9_B2_on
problem:
  yaml: ../problems/mitc_paper41_point.yaml
  adapter: csf.cuf.adapters.problem.c_section_cantilever_point_load
cuf:
  basis: ../expansions/lagrangeL9_v4.py
  order: 2
  basis_options:
    domain_source: csf_polygons
    mapping: isoparametric
    connectivity: shared_points
    boundary_tolerance: 1.0e-10
longitudinal:
  method: finite_element
  element_boundaries:
  - 0.0
  - 1.0
  basis: lagrange
  order: 1
  gauss_order: 15
  material_polynomial_degree: 0
section_integration:
  method: fixed_gauss_polygon
  gauss_order: 9
solver:
  correctionMITC: true
  verifyMITCAssembly: true
  equilibration:
    iterations: 5
sampling:
  stations:
  - 0.0
  - 0.5
  - 1.0
  displacement_samples: 201
  stress_grid: 41
output:
  adapter: csf.cuf.adapters.output.post
  directory: ../output/mitc_paper41_L9_B2_on
