# Version: MITC shear-locking rectangular benchmark CSF v01 - 2026-10-11
# Derived mutatis mutandis from c_section_chapter9_5_3_csf.yaml.
# Units: mm, N, MPa (= N/mm^2).
#
# Prismatic square section: b=100 mm (CUF y), h=100 mm (CUF z).
# Slenderness: L/h = 5000/100 = 50.
# Material: E=75000 MPa, nu=0.33 (same as C-section source).
# CSF station z = longitudinal CUF x; polygon vertices = transverse (y,z).

CSF:
  sections:
    S0:
      z: 0.0
      polygons:
        - name: rectangle
          weight: 75000.0
          vertices:
            - [-50.0, -50.0]
            - [ 50.0, -50.0]
            - [ 50.0,  50.0]
            - [-50.0,  50.0]

    S1:
      z: 5000.0
      polygons:
        - name: rectangle
          weight: 75000.0
          vertices:
            - [-50.0, -50.0]
            - [ 50.0, -50.0]
            - [ 50.0,  50.0]
            - [-50.0,  50.0]

  shear_weight_laws:
    - 'iso(0.33)'
