# Carrera-Giunta Tables 9/10: nodal trigonometric FE longitudinal basis.
# Generated from the matching Lagrange case; physical model and adapters unchanged.
# Note: navier_nodal is a nodal FE basis, NOT the paper's global one-mode Navier ansatz.
case:
  name: cuf_scaled_maclaurin_taper00_table9_N16_navier_nodal

problem:
  yaml: ../../problem/taper00_table9.yaml
  adapter: ../../validation/carrera_problem.py

cuf:
  basis: scaled_maclaurin
  order: 16

longitudinal:
  method: finite_element
  elements: 1
  basis: navier_nodal
  order: 6
  gauss_order: 30

section_integration:
  method: fixed_gauss_polygon
  gauss_order: 6

solver:
  equilibration:
    iterations: 4

sampling:
  stations:
    - 0.00
    - 0.25
    - 0.50
    - 0.75
    - 1.00
  displacement_samples: 201
  stress_grid: 31

output:
  adapter: ../../validation/carrera_post.py
  directory: ../../output/taper00_prismatic/table9_N16_navier_nodal

