model:
  # Tapered I-shaped section obtained from the reference prismatic geometry
  # by progressively reducing the clear web height by 80%.
  csf_yaml: ../models/carrera_i_shaped_taper80.yaml

problem:
  # Same loading and boundary-condition scheme used for the reference
  # prismatic case from Carrera & Giunta (2010).
  #
  # The implementation applies a transverse surface load with a
  # half-wave sinusoidal variation along the beam axis and the
  # associated support conditions.
  type: surface_halfwave_transverse_supported

  # Loaded surface: lower flange of the I-section.
  surface:
    polygon_name: bottom_flange
    edge_start_point_id: 0

  # Load amplitude. The negative sign sets the transverse load direction.
  amplitude: -1
