# FEM3D reference exactly homologous to the CUF torsion_halfwave problem.
# Geometry and load-point trajectories come from the same CSF model.
case:
  name: torsion_halfwave_model2

problem:
  yaml: ../problems/torsion_halfwave.yaml

mesh:
  longitudinal_divisions: 120
  web_width_divisions: 12
  web_height_divisions: 36
  flange_overhang_divisions: 12
  flange_thickness_divisions: 9
  load_gauss_order: 4

analysis:
  element: stdBrick
  system: SparseGeneral

sampling:
  stations: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30,
             0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65,
             0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]

output:
  directory: ../output/torsion_halfwave_model2
