# Modello fisico CSF equivalente, contorno unico di otto vertici.
CSF:
  sections:
    S0:
      z: 0.0
      polygons:
        - name: c_section
          weight: 75000.0
          vertices:
            - [-500.0, -500.0]
            - [0.0, -500.0]
            - [0.0, 500.0]
            - [-1000.0, 500.0]
            - [-1000.0, 400.0]
            - [-100.0, 400.0]
            - [-100.0, -400.0]
            - [-500.0, -400.0]
    S1:
      z: 20000.0
      polygons:
        - name: c_section
          weight: 75000.0
          vertices:
            - [-500.0, -500.0]
            - [0.0, -500.0]
            - [0.0, 500.0]
            - [-1000.0, 500.0]
            - [-1000.0, 400.0]
            - [-100.0, 400.0]
            - [-100.0, -400.0]
            - [-500.0, -400.0]
  shear_weight_laws:
    - 'iso(0.33)'
